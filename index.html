<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Occulte</title>

<style>
/* === FOND VOYANCE === */
body {
    margin: 0;
    height: 100vh;
    font-family: Georgia, serif;
    color: gold;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(circle at center, rgba(255,215,0,0.28), transparent 50%),
        repeating-radial-gradient(
            circle at center,
            rgba(255,215,0,0.22) 0px,
            rgba(255,215,0,0.22) 2px,
            transparent 4px,
            transparent 32px
        ),
        radial-gradient(circle at top, #4b1fa6, #14001f 75%);
}

/* GLYPHES VOYANCE */
body::before {
    content: "𓂀 ✶ ☽ ✶ 𓂀 ✶ ☽ ✶ 𓂀";
    position: fixed;
    inset: 0;
    font-size: 3.8rem;
    opacity: 0.18;
    color: gold;
    text-shadow: 0 0 12px rgba(255,215,0,0.6);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-evenly;
    align-content: space-evenly;
    pointer-events: none;
}

/* ÉTOILES */
.star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: gold;
    border-radius: 50%;
    box-shadow: 0 0 6px gold;
    animation: twinkle 2.8s infinite;
}
@keyframes twinkle {
    0%,100% { opacity: 0; }
    50% { opacity: 1; }
}

/* LOGIN & ANIMATION */
#login, #animation {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#animation {
    display: none;
    flex-direction: column;
}

/* LOGIN */
.box {
    max-width: 360px;
    padding: 20px;
}

h1 {
    font-size: 1.1rem;
    line-height: 1.6;
    text-shadow: 0 0 20px rgba(255,215,0,0.9);
}

input {
    width: 85%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    text-align: center;
    margin: 20px 0;
}

button {
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: linear-gradient(180deg, #ffd700, #b8860b);
    color: #3b0052;
    box-shadow: 0 0 20px rgba(255,215,0,0.9);
}

/* === SCÈNE === */
.scene {
    position: relative;
    width: 360px;
    height: 420px;
}

/* COFFRE */
.chest {
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
    font-size: 5rem;
}

/* COURONNE / COLÈRE */
.crown {
    position: absolute;
    left: 50%;
    top: 25%;
    transform: translateX(-50%);
    font-size: 2.8rem;
    text-shadow: 0 0 12px gold;
    animation: sparkle 2s infinite alternate;
}

@keyframes sparkle {
    0% { transform: translateX(-50%) scale(1); opacity: 0.7; }
    50% { transform: translateX(-50%) scale(1.15); opacity: 1; }
    100% { transform: translateX(-50%) scale(1); opacity: 0.7; }
}

/* OUTILS */
.tools {
    position: absolute;
    left: 50%;
    top: 60%;
    transform: translateX(-50%);
    font-size: 2rem;
    display: flex;
    gap: 14px;
}

/* PERSONNAGE */
.thief {
    position: absolute;
    bottom: 40px;
    right: -120px;
    font-size: 4.2rem;
    animation: escapeLeft 6s infinite linear;
}

/* SAC */
.bag {
    position: absolute;
    font-size: 2.5rem;
    top: 10px;
    left: -25px;
}

/* BILLETS */
.money {
    position: absolute;
    font-size: 1.4rem;
    animation: fall 1.6s infinite;
}

.money:nth-child(3) { animation-delay: 0s; }
.money:nth-child(4) { animation-delay: 0.5s; }
.money:nth-child(5) { animation-delay: 1s; }

/* ANIMATIONS */
@keyframes escapeLeft {
    0% { right: -120px; }
    100% { right: 420px; }
}

@keyframes fall {
    0% { opacity: 1; transform: translate(0, 0); }
    100% { opacity: 0; transform: translate(-30px, 80px); }
}
</style>
</head>

<body>

<script>
for (let i = 0; i < 140; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random()*100+"%";
    s.style.left = Math.random()*100+"%";
    s.style.animationDelay = Math.random()*4+"s";
    document.body.appendChild(s);
}
</script>

<!-- LOGIN -->
<div id="login">
    <div class="box">
        <h1>
            Une vision s'impose à toi.<br>
            Quelqu'un s'enfuit dans l'ombre...<br>
            Prononce l'incantation.
        </h1>
        <input type="password" id="champ" placeholder="Mot de passe">
        <br>
        <button onclick="verifier()">Valider</button>
    </div>
</div>

<!-- ANIMATION -->
<div id="animation">
    <div class="scene">

        <div class="thief">
            🏃‍♂️
            <div class="bag">💰</div>
            <div class="money">💸</div>
            <div class="money">💸</div>
            <div class="money">💸</div>
        </div>

        <div class="crown" id="crown">👑</div>
        <div class="chest">🧰</div>

        <div class="tools">
            🛠️ 🔥
        </div>
    </div>

    <br>
    <button onclick="retour()">RETOUR</button>
</div>

<script>
function verifier() {
    if (champ.value === "clairvoyance") {
        login.style.display = "none";
        animation.style.display = "flex";
    }
}

function retour() {
    animation.style.display = "none";
    login.style.display = "flex";
    champ.value = "";
}

/* ALTERNANCE COURONNE / COLÈRE */
const crown = document.getElementById("crown");
let angry = false;

setInterval(() => {
    angry = !angry;
    crown.textContent = angry ? "😡" : "👑";
}, 1800);
</script>

</body>
</html>
