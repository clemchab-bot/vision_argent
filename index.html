<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vision Occulte</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Georgia, serif;
    color: gold;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at center, rgba(255,215,0,0.18), transparent 55%),
        repeating-radial-gradient(
            circle at center,
            rgba(255,215,0,0.14) 0px,
            rgba(255,215,0,0.14) 1px,
            transparent 2px,
            transparent 38px
        ),
        radial-gradient(circle at top, #3a0ca3, #10002b 70%);
}

/* ÉTOILES */
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: gold;
    border-radius: 50%;
    animation: twinkle 3.5s infinite;
}
@keyframes twinkle {
    0%,100% { opacity: 0; }
    50% { opacity: 1; }
}

/* LOGIN & ANIMATION */
#login, #animation {
    width: 100%;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

#animation {
    display: none;
    flex-direction: column;
}

/* LOGIN */
.box {
    max-width: 360px;
    padding: 20px;
}

h1 {
    font-size: 1.1rem;
    line-height: 1.6;
    text-shadow: 0 0 20px rgba(255,215,0,0.9);
}

input {
    width: 85%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    text-align: center;
    margin: 20px 0;
}

button {
    padding: 12px 30px;
    border-radius: 25px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    background: linear-gradient(180deg, #ffd700, #b8860b);
    color: #3b0052;
    box-shadow: 0 0 20px rgba(255,215,0,0.9);
}

/* === SCÈNE VOL === */
.scene {
    position: relative;
    width: 360px;
    height: 420px;
}

/* COFFRE */
.safe {
    font-size: 5rem;
    position: absolute;
    left: 50%;
    top: 45%;
    transform: translate(-50%, -50%);
}

/* OBJETS AU SOL */
.tools {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 2rem;
    display: flex;
    gap: 18px;
}

/* VOLEUR */
.thief {
    position: absolute;
    bottom: 30px;
    left: -80px;
    font-size: 3rem;
    display: flex;
    align-items: center;
    gap: 6px;
    animation: escape 6s infinite linear;
}

/* SAC */
.bag {
    font-size: 2.4rem;
}

/* BILLETS */
.money {
    position: absolute;
    font-size: 1.4rem;
    animation: fly 2s infinite;
}

/* POSITIONS BILLETS */
.money:nth-child(1) { animation-delay: 0s; left: 20px; }
.money:nth-child(2) { animation-delay: 0.6s; left: 0px; }
.money:nth-child(3) { animation-delay: 1.2s; left: -15px; }

/* ANIMATIONS */
@keyframes escape {
    0% { left: -80px; }
    100% { left: 420px; }
}

@keyframes fly {
    0% {
        opacity: 1;
        transform: translateY(0) rotate(0deg);
    }
    100% {
        opacity: 0;
        transform: translateY(-60px) rotate(25deg);
    }
}
</style>
</head>

<body>

<script>
for (let i = 0; i < 80; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random()*100+"%";
    s.style.left = Math.random()*100+"%";
    s.style.animationDelay = Math.random()*4+"s";
    document.body.appendChild(s);
}
</script>

<!-- LOGIN -->
<div id="login">
    <div class="box">
        <h1>
            Une vision s’impose à toi.<br>
            Quelqu’un s’enfuit dans l’ombre…<br>
            Prononce l’incantation.
        </h1>
        <input type="password" id="champ" placeholder="Mot de passe">
        <br>
        <button onclick="verifier()">Valider</button>
    </div>
</div>

<!-- ANIMATION -->
<div id="animation">
    <div class="scene">

        <!-- COFFRE -->
        <div class="safe">🗄️</div>

        <!-- OBJETS -->
        <div class="tools">
            🔧 🎭
        </div>

        <!-- VOLEUR -->
        <div class="thief">
            🧍‍♂️
            <div class="bag">🎒
                <div class="money">💸</div>
                <div class="money">💸</div>
                <div class="money">💸</div>
            </div>
        </div>

    </div>

    <br>
    <button onclick="retour()">RETOUR</button>
</div>

<script>
function verifier() {
    if (champ.value === "clairvoyance") {
        login.style.display = "none";
        animation.style.display = "flex";
    }
}
function retour() {
    animation.style.display = "none";
    login.style.display = "flex";
    champ.value = "";
}
</script>

</body>
</html>
